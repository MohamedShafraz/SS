  <text x="210" y="238" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700">MSPOS</text>
  <text x="210" y="278" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">Separate shop types. Low-cost plans. One retail system.</text>

