  <text x="200" y="820" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">LKR 5,200 / month</text>

  <rect x="610" y="650" width="420" height="220" rx="28" fill="#ffffff"/>
  <text x="650" y="715" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Electronics Store</text>
  <text x="650" y="760" fill="#475569" font-family="Arial, sans-serif" font-size="22">Fast-moving gadgets and accessories</text>
  <text x="650" y="820" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">LKR 5,900 / month</text>
